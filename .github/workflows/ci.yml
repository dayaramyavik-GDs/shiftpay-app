name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build debug APK in Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: debug-apk
          outputs: type=local,dest=dist
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Decode signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK in Docker
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release-apk
          outputs: type=local,dest=dist
          provenance: false
          build-args: |
            KEY_ALIAS=${{ vars.ANDROID_KEY_ALIAS }}
          secret-files: |
            keystore=${{ runner.temp }}/release.keystore
          secrets: |
            store_password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            key_password=${{ secrets.ANDROID_KEY_PASSWORD }}
          cache-from: type=gha

      - uses: actions/upload-artifact@v7
        with:
          name: shiftpay-apk
          path: dist/*
          if-no-files-found: error

  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shiftpay-apk
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
